name: ISO-17025 Continuum Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-continuum-invariants:
    name: 7-Pass Metrological Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Master Invariant Header
        run: |
          if [ -f "include/torky_continuum_core.hpp" ]; then
            python3 -c "
          with open('include/torky_continuum_core.hpp') as f:
              c = f.read()
              assert '0.36787944117144233' in c, 'l_a Invariant Violated'
              assert '0.016' in c, 'epsilon Invariant Violated'
              assert '11.384' in c, 'V_finite(0) Cap Violated'
              assert '18.50' in c, 'kappa(H) Hard Bound Violated'
              assert '0x14f46b04000ULL' in c, 'Memory Base Invariant Violated'
          print('>>> [PASS] All Analytical Continuum Invariants Verified Exact.')
          "
          fi

      - name: Verify IEEE-754 WebAssembly Binary
        run: |
          if [ -f "docs/torky_kernel.wasm" ]; then
            python3 -c "
          with open('docs/torky_kernel.wasm', 'rb') as f:
              header = f.read(8)
              assert header == b'\x00asm\x01\x00\x00\x00', 'Invalid WASM Magic/Version'
          print('>>> [PASS] Production WebAssembly Binary Sealed.')
          "
          fi

      - name: Validate Sovereign Web UI Assets
        run: |
          if [ -f "docs/index.html" ]; then
            grep -q "ISO/IEC 17025" docs/index.html || exit 1
            grep -q "0x14f46b04000" docs/index.html || exit 1
            grep -q "1dd69a153b00" docs/index.html || exit 1
            echo ">>> [PASS] Web Application Interface Validated."
          fi
